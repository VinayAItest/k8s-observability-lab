apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/VinayAltest/k8s-observability-lab.git
    targetRevision: main
    path: apps/payment-api

  destination:
    server: https://kubernetes.default.svc
    namespace: payment

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
